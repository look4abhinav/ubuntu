# tmux · catppuccin mocha

# ── general ──
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",ghostty:RGB"
set -as terminal-overrides ',*:Smulx=\E[4:%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58:2::%p1%{65536}%/%d:%p1%{256}%/%{255}%&%d:%p1%{255}%&%dm'
set -g set-clipboard on
set -g escape-time 0
set -g history-limit 50000
set -g focus-events on
set -g extended-keys on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S · #W"
set -g mouse on
set -g status-position top

# ── prefix (C-s) ──
unbind C-b
set -g prefix C-s
bind C-s send-prefix

# ── reload ──
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# ── vi mode + copy ──
set -g mode-keys vi
set -g status-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'if [ -n "$WAYLAND_DISPLAY" ]; then wl-copy; elif [ -n "$DISPLAY" ]; then xclip -selection clipboard; fi'
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel 'if [ -n "$WAYLAND_DISPLAY" ]; then wl-copy; elif [ -n "$DISPLAY" ]; then xclip -selection clipboard; fi'

# ── splits open in current dir ──
bind-key '"' split-window    -c "#{pane_current_path}"
bind-key %   split-window -h -c "#{pane_current_path}"
bind-key c   new-window      -c "#{pane_current_path}"

# ── catppuccin ──
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "default"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_pane_status_enabled "no"
set -g @catppuccin_pane_border_style "fg=#{@thm_overlay_0}"
set -g @catppuccin_pane_active_border_style "fg=#{@thm_lavender}"

# ── status line ──
set -g status-left-length 100
set -g status-right-length 150
set -g status-interval 5
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}#{E:@catppuccin_status_date_time}"

# ── plugins ──
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.1.0'
set -g @plugin 'christoomey/vim-tmux-navigator'

# ── bootstrap ──
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone --quiet https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"
if "test -f ~/.config/tmux/plugins/tmux/catppuccin.tmux" \
   "run '~/.config/tmux/plugins/tmux/catppuccin.tmux'"
run '~/.config/tmux/plugins/tpm/tpm'